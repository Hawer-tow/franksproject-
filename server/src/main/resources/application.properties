spring.application.name=MobileDb

# Secrets (DB passwords, Jenga / Daraja keys) live in server/.env, which is gitignored.
# Copy .env.example to .env and fill it in. Real environment variables override it.
spring.config.import=optional:file:.env[.properties]

# Kisenyi DB (supports env override)
spring.datasource.kisenyi.jdbc-url=${KISENYI_JDBC_URL:jdbc:mysql://127.0.0.1:3306/kisenyi?useSSL=false&serverTimezone=UTC}
spring.datasource.kisenyi.username=${KISENYI_DB_USER:root}
spring.datasource.kisenyi.password=${KISENYI_DB_PASSWORD}
spring.datasource.kisenyi.driver-class-name=com.mysql.cj.jdbc.Driver

# Customer DB (supports env override)
spring.datasource.customer.jdbc-url=${CUSTOMER_JDBC_URL:jdbc:mysql://127.0.0.1:3306/customer?useSSL=false&serverTimezone=UTC}
spring.datasource.customer.username=${CUSTOMER_DB_USER:root}
spring.datasource.customer.password=${CUSTOMER_DB_PASSWORD}
spring.datasource.customer.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Server port
server.port=8080

jenga.merchantCode=1099811292
jenga.apiKey=${JENGA_API_KEY}
jenga.consumerSecret=${JENGA_CONSUMER_SECRET}
jenga.baseUrl=https://uat.finserve.africa
jenga.privateKeyPath=classpath:keys/jenga_private.pem
jenga.publicKeyPath=classpath:keys/jenga_public.pem

# Use the same credentials you registered in the Jenga IPN portal
spring.security.user.name=${SPRING_SECURITY_USER}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}


# Daraja

# OAuth credentials
daraja.consumerKey=${DARAJA_CONSUMER_KEY}
daraja.consumerSecret=${DARAJA_CONSUMER_SECRET}
daraja.tokenUrl=https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials

# STK Push
daraja.stkPushUrl=https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest
daraja.passkey=${DARAJA_PASSKEY}
daraja.stkResultUrl=https://geomagnetic-confessedly-juanita.ngrok-free.dev/callback/stkpush/result
daraja.stkTimeoutUrl=https://geomagnetic-confessedly-juanita.ngrok-free.dev/callback/stkpush/timeout
daraja.shortcode=174379

# B2C
daraja.b2cUrl=https://sandbox.safaricom.co.ke/mpesa/b2c/v1/paymentrequest
daraja.b2cResultUrl=https://geomagnetic-confessedly-juanita.ngrok-free.dev/callback/result
daraja.b2cTimeoutUrl=https://geomagnetic-confessedly-juanita.ngrok-free.dev/callback/timeout
daraja.b2cShortcode=600998

# B2C test credentials
daraja.initiatorName=testapi
daraja.initiatorPassword=${DARAJA_INITIATOR_PASSWORD}
daraja.certificatePath=certs/SandboxCertificate.cer

# Shortcode and test parties

daraja.partyA=600000
daraja.partyB=254708374149
